name: Keep Streamlit Awake

on:
  schedule:
    # 3時間ごとにブラウザでアクセスしてアプリを起こす
    - cron: '0 * * * *'
    # 毎月1日の0時にダミ�Eコミットを行ってGitHub Actionsの自動停止(60日ルール)を回避する
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write # ダミ�Eコミット�EPush権陁E
jobs:
  keep-awake:
    # 毎月1日のダミ�Eコミット用スケジュール"以夁Eで実行！E時間ごと、また�E手動�E�E    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake up Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          URL = 'https://indoorfootballbooking.streamlit.app/'
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f'Navigating to {URL}')
              try:
                  print('Waiting for page load or sleep button to appear...')
                  page.goto(URL, timeout=60000)
                  
                  # 動的征E��でスリープ復旧ボタンを検索
                  btn = page.locator('button:has-text(\"Yes, get this app back up\")')
                  btn.wait_for(state='visible', timeout=60000)
                  
                  if btn.is_visible():
                      print('App is sleeping. Clicking wake up button...')
                      btn.first.click()
                      page.wait_for_timeout(60000) # クリチE��後�E復旧征E��E                      print('App woke up successfully.')
              except Exception as e:
                  print('Sleep button not found. App is likely already awake.')
              finally:
                  browser.close()
          "

  dummy-commit:
    # 毎月1日のスケジュール実行時にのみ動かぁE    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy commit
        run: |
          date > .github/keepalive.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive.txt
          git commit -m 'chore: dummy commit to prevent GitHub Actions from disabling cron' || echo "No changes"
          git push
