name: Keep Streamlit Awake

on:
  schedule:
    # 毎日 午前9時 (UTCの0時) と 午後9時 (UTCの12時) に実行して確実にスリープを防ぐ
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  ping-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging Streamlit App to keep it awake..."
          curl -sL -b /tmp/cookies.txt -c /tmp/cookies.txt https://indoorfootballbooking.streamlit.app/_stcore/health > /dev/null || true
          echo "Done!"
